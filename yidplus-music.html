<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🎵 YID PLUS — Music</title>
<link rel="stylesheet" href="css/style.css">
<script>
(function () {
  try {
    var raw = localStorage.getItem('yp_theme');
    if (!raw) return;
    var t = JSON.parse(raw);
    var r = document.documentElement.style;
    r.setProperty('--gold', t.gold);
    r.setProperty('--gold-l', t.goldL);
    r.setProperty('--gold-d', t.gold);
    r.setProperty('--bg', t.bg);
    r.setProperty('--bg2', t.bg2);
    r.setProperty('--text', t.text);
  } catch (e) {}
})();
</script>
</head>
<body>

<!-- ══ MUSIC SCREEN ══ -->
<div class="screen active" id="screen-music">
  <div class="topbar">
    <div class="topbar-logo">👑 Music</div>
    <div style="display:flex;gap:.5rem">
      <div class="icon-btn" onclick="toast('Search music')">🔍</div>
      <div class="icon-btn" onclick="openLikedSongs()">❤️</div>
      <div class="icon-btn" onclick="toast('Music upload: coming soon')">＋</div>
    </div>
  </div>
  <div class="music-tabs">
    <button class="mtab active" onclick="switchMusicTab(this,'all')">All</button>
    <button class="mtab" onclick="switchMusicTab(this,'albums')">Albums</button>
    <button class="mtab" onclick="switchMusicTab(this,'singles')">Singles</button>
    <button class="mtab" onclick="switchMusicTab(this,'videos')">Videos</button>
    <button class="mtab" onclick="openLikedSongs()">❤️ Liked</button>
  </div>
  <div class="scroll-area" style="padding-bottom:160px" id="music-scroll">
    <div id="sec-albums">
      <div class="section-hdr"><h2>💿 Albums & CDs</h2><button class="see-all">See All →</button></div>
      <div style="display:flex;gap:.75rem;overflow-x:auto;padding:0 1rem .75rem;scrollbar-width:none" id="albums-row"></div>
    </div>
    <div id="sec-singles">
      <div class="section-hdr"><h2>🎵 Singles</h2><button class="see-all">See All →</button></div>
      <div id="singles-list"></div>
    </div>
    <div id="sec-videos">
      <div class="section-hdr"><h2>🎬 Music Videos</h2><button class="see-all">See All →</button></div>
      <div class="mv-row" id="mv-row"></div>
    </div>
    <div id="sec-liked" style="display:none">
      <div class="section-hdr"><h2>❤️ My Liked Songs</h2></div>
      <div id="liked-list"></div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-item"        onclick="goPage('yidplus-dashboard.html')"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></button>
    <button class="nav-item"        onclick="goPage('yidplus-shorts.html')">  <span class="nav-icon">🎬</span><span class="nav-label">Shorts</span></button>
    <button class="nav-item active" onclick="navTo('music')">              <span class="nav-icon">🎵</span><span class="nav-label">Music</span></button>
    <button class="nav-item"        onclick="goPage('yidplus-chat.html')">   <span class="nav-icon">💬</span><span class="nav-label">Chats</span></button>
    <button class="nav-item"        onclick="goPage('yidplus-dashboard.html')"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></button>
  </nav>
</div>

<!-- ══ MINI PLAYER ══ -->
<div class="mini-player" id="mini-player" onclick="navTo('player')">
  <div id="mini-prog"></div>
  <div class="mini-thumb" id="mini-thumb">🎵</div>
  <div style="flex:1;min-width:0">
    <div id="mini-name" style="font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
    <div id="mini-artist" style="font-size:.67rem;color:var(--muted)"></div>
  </div>
  <div style="display:flex;align-items:center;gap:.4rem" onclick="event.stopPropagation()">
    <button class="mini-ctrl-btn" onclick="prevTrack()">⏮</button>
    <button class="mini-play-btn" id="mini-play-btn" onclick="togglePlay()">▶</button>
    <button class="mini-ctrl-btn" onclick="nextTrack()">⏭</button>
  </div>
</div>

<!-- ══ FULL PLAYER SCREEN ══ -->
<div class="screen" id="screen-player">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;flex-shrink:0">
    <div class="icon-btn" onclick="navTo('music')">‹</div>
    <div style="font-size:.73rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)">Now Playing</div>
    <div class="icon-btn" onclick="shareTrack()">📤</div>
  </div>
  <div class="scroll-area">
    <div class="mode-toggle">
      <button class="mode-btn active" id="song-mode-btn" onclick="setPlayerMode('song')">🎵 Song Mode</button>
      <button class="mode-btn" id="video-mode-btn" onclick="setPlayerMode('video')">🎬 Video Mode</button>
    </div>
    <div class="artwork-wrap" id="artwork-wrap">
      <div class="artwork" id="artwork"><div class="artwork-bg" id="artwork-bg"></div><div class="artwork-emoji" id="artwork-emoji">🎵</div></div>
    </div>
    <div id="vid-player-wrap" style="display:none;margin:0 1rem 1.25rem">
      <div style="border-radius:14px;background:#111;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:5rem;border:1px solid var(--border);position:relative;overflow:hidden;cursor:pointer;color:#fff" onclick="togglePlay()">
        <div id="vp-emoji" style="position:relative;z-index:1;font-size:5rem"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)"><div id="vp-btn" style="width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:1.4rem">▶</div></div>
      </div>
    </div>
    <div style="padding:0 1.25rem;margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between">
      <div><div id="player-name" style="font-size:1.05rem;font-weight:700"></div><div id="player-artist" style="font-size:.8rem;color:var(--muted);margin-top:.2rem"></div></div>
      <div style="display:flex;gap:.5rem;align-items:center">
        <div class="heart-big" id="heart-big" onclick="toggleLike()">🤍</div>
        <div class="icon-btn" onclick="shareTrack()">📤</div>
      </div>
    </div>
    <div style="padding:0 1.25rem;margin-bottom:.5rem">
      <div class="prog-bar" id="prog-bar" onclick="seekTo(event)"><div class="prog-fill" id="prog-fill"></div><div class="prog-dot" id="prog-dot"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:.65rem;color:var(--muted)"><span id="t-cur">0:00</span><span id="t-tot">0:00</span></div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" id="shuf-btn" onclick="toggleShuffle()">🔀</button>
      <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
      <button class="play-big-btn" id="play-big-btn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
      <button class="ctrl-btn" id="rep-btn" onclick="toggleRepeat()">🔁</button>
    </div>
    <div class="queue-section">
      <div class="queue-hdr">Up Next</div>
      <div id="queue-list"></div>
    </div>
  </div>
</div>

<div id="app-toast"></div>

<script src="js/state.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
<script src="js/music.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  AUTH.restore().then(function (user) {
    if (!user) { goPage('yidplus-dashboard.html'); return; }
    applyRoleUI();
    navTo('music');
  });
});
</script>

</body>
</html>
