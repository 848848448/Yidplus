name: Validate Android release
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Bundle public UI
        run: python3 android/scripts/bundle.py
      - name: Validate unsigned build only
        working-directory: android
        run: gradle assembleRelease --no-daemon
# Distribution is locally signed with the private vault key. Never publish a debug
# build, unsigned release or private keystore from this validation workflow.
