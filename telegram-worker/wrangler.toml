name = "yidplus-telegram-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# @mtproto/core logs through the `debug` package. That package chooses a browser
# or node build at import time, and in the Workers runtime the one it picks has
# no `.extend`, so the module throws at startup ("baseDebug.extend is not a
# function") and the deploy fails. Point it at a no-op with the same shape.
[alias]
"debug" = "./src/debug-stub.cjs"

# Poll Telegram once a minute. This is the closest Cloudflare gets to "live";
# there is no always-on process here, each run connects, reads, and exits.
[triggers]
crons = ["* * * * *"]

# Stores the MTProto auth keys + the id of the last post we forwarded per
# channel, so a run only sends what's new. Create it once with:
#   npx wrangler kv namespace create TG_SESSION
# then paste the printed id below.
[[kv_namespaces]]
binding = "TG_SESSION"
id = "7978d36629a5452e813d23115998f17a"

# Media downloaded from Telegram is written straight into the site's bucket, so
# the site serves it from /api/media like any other upload. Going through the
# ingest endpoint as base64 instead would waste CPU we don't have.
[[r2_buckets]]
binding     = "MY_BUCKET"
bucket_name = "yidplus-media"

[vars]
# Where to send the posts. The ingest endpoint already lives on the site.
INGEST_URL = "https://yidplus.com/api/telegram-ingest"
# Where to read the channel list from (added in the admin panel).
CHANNELS_URL = "https://yidplus.com/api/telegram-channels"
# How many recent posts to look at per channel on each run.
FETCH_LIMIT = "20"
# Skip files bigger than this. Every chunk is decrypted in pure JS, so size is
# what decides whether a run survives. Photos and short clips fit; a long video
# will not, on the free plan.
MEDIA_MAX_MB = "6"
# How many files one run may download.
#
# Downloading means decrypting the file in pure JS, and the free plan's CPU per
# run only covers roughly one. Asking for more is what produced Error 1102 —
# some files landed, then the run died and took the text sync with it.
# One per run never trips the limit, and since the cron fires every minute the
# backlog clears itself. Raise to 4+ only on the Workers Paid plan.
MEDIA_PER_RUN = "1"

# Secrets — set these with `npx wrangler secret put <NAME>`, never in this file:
#   TELEGRAM_API_ID          from my.telegram.org
#   TELEGRAM_API_HASH        from my.telegram.org
#   TELEGRAM_INGEST_SECRET   same value as the Pages env var of the same name
#   WORKER_ADMIN_SECRET      a password you invent; guards the /login endpoints
