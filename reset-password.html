<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — YID PLUS</title>
  <link rel="icon" href="images/logo.png?v=202607210344">
  <style>
    :root { --gold:#1F6F5C; --gold-l:#2B8A73; --bg:#FAFAF8; --surface:#fff; --text:#14151A; --muted:#6B7280; --border:#E5E4E0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .card { width:100%; max-width:380px; background:var(--surface); border-radius:20px; padding:2rem 1.75rem; box-shadow:0 4px 24px rgba(0,0,0,.08); }
    .logo { text-align:center; margin-bottom:1.25rem; }
    .logo img { height:56px; width:auto; border-radius:14px; }
    h1 { font-size:1.35rem; margin:0 0 .35rem; text-align:center; }
    .sub { font-size:.85rem; color:var(--muted); text-align:center; margin-bottom:1.5rem; line-height:1.5; }
    label { display:block; font-size:.8rem; font-weight:600; margin-bottom:.35rem; }
    input { width:100%; padding:.8rem .9rem; border:1.5px solid var(--border); border-radius:12px; font-size:1rem; font-family:inherit; margin-bottom:1rem; outline:none; transition:border .2s; }
    input:focus { border-color:var(--gold); }
    button { width:100%; padding:.85rem; background:var(--gold); color:#fff; border:none; border-radius:24px; font-size:.95rem; font-weight:700; cursor:pointer; font-family:inherit; transition:filter .2s; }
    button:hover { filter:brightness(1.06); }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .msg { font-size:.85rem; text-align:center; margin-top:1rem; padding:.75rem; border-radius:10px; display:none; }
    .msg.err { background:rgba(211,47,47,.08); color:#C62828; display:block; }
    .msg.ok { background:rgba(31,111,92,.08); color:var(--gold); display:block; }
    .back { display:block; text-align:center; margin-top:1.25rem; font-size:.82rem; color:var(--gold); text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="images/logo.png?v=202607210344" alt="YID PLUS" onerror="this.style.display='none'"></div>
    <h1>Set a new password</h1>
    <div class="sub">Choose a new password for your account. Make it at least 6 characters.</div>

    <div id="form-wrap">
      <label for="pw1">New password</label>
      <input type="password" id="pw1" placeholder="New password" autocomplete="new-password">
      <label for="pw2">Confirm new password</label>
      <input type="password" id="pw2" placeholder="Confirm new password" autocomplete="new-password">
      <button id="submit-btn" onclick="doReset()">Save New Password</button>
    </div>

    <div class="msg" id="msg"></div>
    <a class="back" href="/index.html">← Back to sign in</a>
  </div>

  <script>
    function qp(name) { return new URLSearchParams(location.search).get(name); }
    var TOKEN = qp('token');

    function showMsg(text, kind) {
      var m = document.getElementById('msg');
      m.textContent = text;
      m.className = 'msg ' + kind;
    }

    if (!TOKEN) {
      document.getElementById('form-wrap').style.display = 'none';
      showMsg('This reset link is missing its token. Please use the link from your email, or request a new one.', 'err');
    }

    function doReset() {
      var p1 = document.getElementById('pw1').value;
      var p2 = document.getElementById('pw2').value;
      if (p1.length < 6) return showMsg('Password must be at least 6 characters.', 'err');
      if (p1 !== p2)     return showMsg('The two passwords don\u2019t match.', 'err');

      var btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = 'Saving\u2026';

      fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: TOKEN, password: p1 }),
      })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) {
          document.getElementById('form-wrap').style.display = 'none';
          showMsg('\u2705 Your password has been changed. You can now sign in with it.', 'ok');
        } else {
          showMsg('\u274C ' + (res.error || 'Something went wrong.'), 'err');
          btn.disabled = false; btn.textContent = 'Save New Password';
        }
      })
      .catch(function () {
        showMsg('\u274C Could not reach the server. Please try again.', 'err');
        btn.disabled = false; btn.textContent = 'Save New Password';
      });
    }

    // Enter key submits
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && TOKEN) doReset();
    });
  </script>
</body>
</html>
