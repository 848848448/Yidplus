<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>👑 YID PLUS — Admin</title>
<link rel="stylesheet" href="css/style.css?v=202607190838">
<script>
(function () {
  try {
    var raw = localStorage.getItem('yp_theme');
    if (!raw) return;
    var t = JSON.parse(raw);
    var r = document.documentElement.style;
    r.setProperty('--gold', t.gold);
    r.setProperty('--gold-l', t.goldL);
    r.setProperty('--gold-d', t.gold);
    r.setProperty('--bg', t.bg);
    r.setProperty('--bg2', t.bg2);
    r.setProperty('--text', t.text);
  } catch (e) {}
  try {
    if (localStorage.getItem('yp_dark_mode') === '1') document.documentElement.classList.add('dark-mode');
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Suez+One&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"></head>
<body>

<!-- ══ ADMIN GATE (2-step: email + PIN) ══ -->
<div id="admin-gate" style="min-height:100vh;align-items:center;justify-content:center;padding:1.5rem;background:var(--bg)">
  <div style="width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:2rem 1.75rem;animation:fadeIn .6s ease">
    <div style="text-align:center;font-size:2.8rem;margin-bottom:.5rem;filter:drop-shadow(0 0 16px rgba(201,168,76,.5))">👑</div>
    <div style="text-align:center;font-size:1.3rem;font-weight:700;letter-spacing:.1em;background:linear-gradient(135deg,var(--gold-l),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem">Admin Access</div>
    <div style="text-align:center;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:1.75rem">YID PLUS Control Center</div>

    <div style="display:flex;gap:.4rem;justify-content:center;margin-bottom:1.5rem">
      <div class="step-dot active" id="step0"></div>
      <div class="step-dot" id="step1"></div>
    </div>

    <div class="gate-msg" id="gate-msg"></div>

    <!-- Step 1: Email -->
    <div id="gate-email-step">
      <label class="field-lbl">Admin Email</label>
      <input class="field" type="email" id="gate-email" placeholder="admin@example.com" onkeydown="if(event.key==='Enter')checkGateEmail()">
      <button class="btn-primary" id="gate-email-btn" onclick="checkGateEmail()">
        <span id="gate-email-txt">Continue →</span>
        <div class="dots" id="gate-email-dots"><span></span><span></span><span></span></div>
      </button>
    </div>

    <!-- Step 2: PIN -->
    <div id="gate-pin-step" style="display:none">
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:1rem;text-align:center">Enter your 4-digit Admin PIN</div>
      <div style="display:flex;gap:.6rem;justify-content:center;margin-bottom:1.25rem">
        <input class="field" style="width:52px;height:60px;text-align:center;font-size:1.5rem;margin-bottom:0;padding:0" type="password" maxlength="1" inputmode="numeric" id="p0" oninput="pinFocus(0)">
        <input class="field" style="width:52px;height:60px;text-align:center;font-size:1.5rem;margin-bottom:0;padding:0" type="password" maxlength="1" inputmode="numeric" id="p1" oninput="pinFocus(1)">
        <input class="field" style="width:52px;height:60px;text-align:center;font-size:1.5rem;margin-bottom:0;padding:0" type="password" maxlength="1" inputmode="numeric" id="p2" oninput="pinFocus(2)">
        <input class="field" style="width:52px;height:60px;text-align:center;font-size:1.5rem;margin-bottom:0;padding:0" type="password" maxlength="1" inputmode="numeric" id="p3" oninput="pinFocus(3)">
      </div>
      <button class="btn-primary" id="gate-pin-btn" onclick="checkPin()">
        <span id="gate-pin-txt">Unlock Panel</span>
        <div class="dots" id="gate-pin-dots"><span></span><span></span><span></span></div>
      </button>
      <div style="text-align:center;margin-top:.75rem">
        <span style="font-size:.72rem;color:var(--muted);cursor:pointer" onclick="backToEmailStep()">← Back</span>
      </div>
    </div>

    <div style="text-align:center;margin-top:1.25rem">
      <span style="font-size:.75rem;color:var(--muted);cursor:pointer" onclick="goPage('/')">← Back to YID PLUS</span>
    </div>
  </div>
</div>

<!-- ══ ADMIN PANEL ══ -->
<div class="screen" id="screen-admin">
  <div class="admin-topbar">
    <div style="display:flex;align-items:center;gap:.5rem">
      <span style="font-size:1.2rem">👑</span>
      <span class="topbar-logo">YID PLUS</span>
      <span class="owner-badge" id="admin-role-badge">ADMIN</span>
    </div>
    <button class="logout-btn" onclick="goPage('/')">Exit</button>
  </div>

  <div class="admin-nav" id="admin-nav-row" style="display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--bg2);scrollbar-width:none;flex-shrink:0"></div>

  <div class="admin-content" id="admin-content"></div>
</div>

<div id="app-toast"></div>

<script src="js/state.js?v=202607190838"></script>
<script src="js/theme.js?v=202607190838"></script>
<script src="js/app.js?v=202607190838"></script>
<script src="js/admin.js?v=202607190838"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  AUTH.restore().then(function (user) {
    if (!user) { goPage('/'); return; }
    if (!isAnyAdmin()) {
      toast('⚠ You do not have admin access.');
      setTimeout(function () { goPage('/'); }, 1500);
      return;
    }
    // Only reveal the gate now that we've confirmed, via the real session
    // cookie, that this person is actually logged in as an admin account.
    document.getElementById('admin-gate').classList.add('open');
    // Pre-fill AND lock the gate email to their own verified session email —
    // typing an arbitrary email here previously let any admin impersonate
    // a higher-privileged one (e.g. the owner) just by knowing their address.
    var ge = document.getElementById('gate-email');
    if (ge) { ge.value = STATE.user.email; ge.readOnly = true; }
  });
});
</script>

</body>
          </html>
