</style>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#1F6F5C"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Suez+One&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"></head>
<body>

<!-- ══ SHORTS SCREEN ══ -->
<div class="screen active" id="screen-shorts" style="background:#000">
  <div class="shorts-topbar">
    <div class="topbar-logo">👑 YID PLUS</div>
    <div class="shorts-topbar-title">Shorts</div>
    <div class="shorts-upload-btn" onclick="document.getElementById('upload-modal').classList.add('open')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
  </div>

  <div class="swipe-cont" id="swipe-cont" style="height:100vh;width:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain"></div>

  <nav class="bottom-nav" style="position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.9);border-top:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);z-index:60"><button class="nav-item" data-nav="chats" onclick="goPage('/chat')"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span class="nav-label">Chats</span></button><button class="nav-item" data-nav="music" onclick="goPage('/music')"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span><span class="nav-label">Music</span></button><button class="nav-item active" data-nav="shorts" onclick="navTo('shorts')"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></span><span class="nav-label">Shorts</span></button><button class="nav-item" data-nav="explore" onclick="goPage('/?goto=explore')"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5"/></svg></span><span class="nav-label">Channels</span></button><button class="nav-item" data-nav="settings" onclick="goPage('/?goto=settings')"><span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span class="nav-label">Settings</span></button></nav>
</div>

<!-- ══ COMMENTS DRAWER ══ -->
<div class="cmt-drawer" id="cmt-drawer">
  <div class="drawer-handle"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem .5rem">
    <div style="font-size:.9rem;color:rgba(255,255,255,.9)">💬 Comments <span id="cmt-count" style="color:rgba(255,255,255,.4);font-size:.8rem"></span></div>
    <button style="background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center" onclick="closeCmts()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="comments-list" id="cmt-list"></div>
  <div class="comment-input-row">
    <input class="comment-input" id="cmt-input" placeholder="Add a comment..." maxlength="200" onkeydown="if(event.key==='Enter')sendCmt()">
    <button class="cmt-send-el" onclick="sendCmt()"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </div>
</div>

<!-- ══ UPLOAD MODAL ══ -->
<div class="upload-modal" id="upload-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="upload-sheet">
    <div class="upload-title">Upload a Short</div>
    <div class="upload-options">
      <div class="upload-opt" onclick="document.getElementById('vid-file-input').click()">
        <div class="upload-opt-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
        <div class="upload-opt-label">Choose Video</div>
      </div>
      <div class="upload-opt" onclick="toast('Camera not available in browser preview')">
        <div class="upload-opt-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        <div class="upload-opt-label">Record with Camera</div>
      </div>
    </div>
    <button class="upload-cancel" onclick="document.getElementById('upload-modal').classList.remove('open')">Cancel</button>
    <input type="file" id="vid-file-input" accept="video/*" style="display:none" onchange="handleVidUpload(event)">
  </div>
</div>

<!-- ══ CAPTION MODAL (shown after picking a video, replaces the old blocking prompt()) ══ -->
<div class="upload-modal" id="caption-modal">
  <div class="upload-sheet">
    <div class="upload-title">Add a caption</div>
    <textarea id="caption-input" placeholder="Write a caption for your short... (optional)" maxlength="200" rows="3" style="width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:.75rem;color:#fff;font-family:inherit;font-size:.88rem;resize:none;outline:none;margin-bottom:1rem"></textarea>
    <button class="upload-cancel" style="background:var(--blue);color:#fff;border:none;margin-bottom:.5rem" onclick="confirmShortUpload()">Post Short</button>
    <button class="upload-cancel" onclick="cancelShortUpload()">Cancel</button>
  </div>
</div>

<div id="app-toast"></div>

<script src="js/state.js?v=202607110530"></script>
<script src="js/theme.js?v=202607110530"></script>
<script src="js/app.js?v=202607110530"></script>
<script src="js/shorts.js?v=202607110530"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  AUTH.restore().then(function (user) {
    if (!user) return new Promise(function(r){setTimeout(r,300)}).then(function(){return AUTH.restore();});
    return user;
  }).then(function (user) {
    if (!user) { goPage('/'); return; }
    if (typeof loadAppSettings === 'function') loadAppSettings();
    navTo('shorts');
    initAds('shorts');
  });
});
</script>

<script src="js/ads.js?v=202607110530"></script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js")</script></body>
