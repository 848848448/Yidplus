<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🎬 YID PLUS — Shorts</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* Shorts page is always dark, regardless of user theme */
html, body { background: #000 !important; }
</style>
</head>
<body>

<!-- ══ SHORTS SCREEN ══ -->
<div class="screen active" id="screen-shorts" style="background:#000">
  <div class="shorts-topbar">
    <div class="topbar-logo">👑 YID PLUS</div>
    <div class="shorts-topbar-title">Shorts</div>
    <div class="shorts-upload-btn" onclick="document.getElementById('upload-modal').classList.add('open')">＋</div>
  </div>

  <div class="progress-dots" id="prog-dots" style="position:fixed;right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:40"></div>

  <div class="swipe-cont" id="swipe-cont" style="height:100vh;width:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none"></div>

  <nav class="bottom-nav" style="position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.85);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(12px);z-index:60">
    <button class="nav-item" style="--muted:rgba(255,255,255,.4)" onclick="goPage('yidplus-dashboard.html')"><span class="nav-icon">🏠</span><span class="nav-label" style="color:rgba(255,255,255,.4)">Home</span></button>
    <button class="nav-item active" onclick="navTo('shorts')"><span class="nav-icon">🎬</span><span class="nav-label">Shorts</span></button>
    <button class="nav-item" onclick="goPage('yidplus-music.html')"><span class="nav-icon">🎵</span><span class="nav-label" style="color:rgba(255,255,255,.4)">Music</span></button>
    <button class="nav-item" onclick="goPage('yidplus-chat.html')"><span class="nav-icon">💬</span><span class="nav-label" style="color:rgba(255,255,255,.4)">Chats</span></button>
    <button class="nav-item" onclick="goPage('yidplus-dashboard.html')"><span class="nav-icon">⚙️</span><span class="nav-label" style="color:rgba(255,255,255,.4)">Settings</span></button>
  </nav>
</div>

<!-- ══ COMMENTS DRAWER ══ -->
<div class="cmt-drawer" id="cmt-drawer">
  <div class="drawer-handle"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem .5rem">
    <div style="font-size:.9rem;color:rgba(255,255,255,.9)">💬 Comments <span id="cmt-count" style="color:rgba(255,255,255,.4);font-size:.8rem"></span></div>
    <button style="background:none;border:none;color:rgba(255,255,255,.5);font-size:1.1rem;cursor:pointer" onclick="closeCmts()">✕</button>
  </div>
  <div class="comments-list" id="cmt-list"></div>
  <div class="comment-input-row">
    <input class="comment-input" id="cmt-input" placeholder="Add a comment..." maxlength="200" onkeydown="if(event.key==='Enter')sendCmt()">
    <button class="cmt-send-el" onclick="sendCmt()">➤</button>
  </div>
</div>

<!-- ══ UPLOAD MODAL ══ -->
<div class="upload-modal" id="upload-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="upload-sheet">
    <div class="upload-title">Upload a Short</div>
    <div class="upload-options">
      <div class="upload-opt" onclick="document.getElementById('vid-file-input').click()">
        <div class="upload-opt-icon">📁</div>
        <div class="upload-opt-label">Choose Video</div>
      </div>
      <div class="upload-opt" onclick="toast('Camera not available in browser preview')">
        <div class="upload-opt-icon">📷</div>
        <div class="upload-opt-label">Record with Camera</div>
      </div>
    </div>
    <button class="upload-cancel" onclick="document.getElementById('upload-modal').classList.remove('open')">Cancel</button>
    <input type="file" id="vid-file-input" accept="video/*" style="display:none" onchange="handleVidUpload(event)">
  </div>
</div>

<div id="app-toast"></div>

<script src="js/state.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
<script src="js/shorts.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  AUTH.restore().then(function (user) {
    if (!user) { goPage('yidplus-dashboard.html'); return; }
    navTo('shorts');
  });
});
</script>

</body>
</html>
